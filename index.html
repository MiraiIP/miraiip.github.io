<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Добавление VPN-подписки - CROL VPN</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: linear-gradient(135deg, #0a0a0a 0%, #1a1a1a 100%);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    color: #e8f7f4;
  }

  .container {
    max-width: 440px;
    width: 100%;
    background: #1a1a1a;
    border-radius: 20px;
    padding: 40px 30px;
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
    border: 1px solid rgba(32, 178, 170, 0.2);
    text-align: center;
  }

  .logo {
    width: 72px;
    height: 72px;
    margin: 0 auto 16px;
    border-radius: 20px;
    box-shadow: 0 8px 24px rgba(32, 178, 170, 0.3);
    overflow: hidden;
  }

  .logo img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    display: block;
  }

  h1 {
    font-size: 28px;
    font-weight: 700;
    margin-bottom: 8px;
    background: linear-gradient(135deg, #20B2AA, #00CED1);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  .subtitle {
    font-size: 15px;
    color: #808080;
    margin-bottom: 36px;
  }

  /* --- Loading state --- */
  #loading-state {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
  }

  .spinner {
    width: 40px;
    height: 40px;
    border: 3px solid rgba(32, 178, 170, 0.2);
    border-top-color: #20B2AA;
    border-radius: 50%;
    animation: spin 0.9s linear infinite;
  }

  @keyframes spin {
    to { transform: rotate(360deg); }
  }

  .loading-text {
    font-size: 16px;
    color: #b0b0b0;
    font-weight: 400;
  }

  /* --- Button state --- */
  #action-state {
    display: none;
    flex-direction: column;
    gap: 12px;
  }

  .hint {
    font-size: 14px;
    color: #808080;
    margin-bottom: 8px;
    line-height: 1.5;
  }

  .btn {
    display: block;
    width: 100%;
    padding: 15px 24px;
    border-radius: 12px;
    font-family: inherit;
    font-weight: 600;
    font-size: 16px;
    cursor: pointer;
    border: none;
    text-decoration: none;
    transition: transform 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
  }

  .btn:active {
    transform: scale(0.98);
  }

  .btn-primary {
    background: linear-gradient(135deg, #20B2AA, #00CED1);
    color: #0a0a0a;
    box-shadow: 0 4px 16px rgba(32, 178, 170, 0.35);
  }

  .btn-primary:hover {
    box-shadow: 0 6px 22px rgba(32, 178, 170, 0.5);
    transform: translateY(-1px);
  }

  .btn-secondary {
    background: transparent;
    color: #20B2AA;
    border: 1.5px solid rgba(32, 178, 170, 0.5);
  }

  .btn-secondary:hover {
    background: rgba(32, 178, 170, 0.08);
    border-color: #20B2AA;
  }

  /* --- Error state --- */
  #error-state {
    display: none;
  }

  .error-text {
    color: #ea4e43;
    font-size: 15px;
    line-height: 1.5;
  }
</style>
</head>
<body>

<div class="container">
  <div class="logo">
    <img src="https://raw.githubusercontent.com/MiraiIP/CROL_images/main/logo.png" alt="CROL VPN" loading="eager">
  </div>
  <h1>CROL VPN</h1>
  <p class="subtitle">Добавление подписки</p>

  <!-- Loading -->
  <div id="loading-state">
    <div class="spinner"></div>
    <p class="loading-text">Открываем приложение…</p>
  </div>

  <!-- Buttons (shown if auto-redirect failed) -->
  <div id="action-state">
    <p class="hint">Приложение не открылось автоматически.<br>Выберите действие:</p>
    <button id="btn-add" class="btn btn-primary">Добавить подписку</button>
    <a id="btn-store" class="btn btn-secondary" href="#" style="display:none;">Скачать приложение</a>
  </div>

  <!-- Error -->
  <div id="error-state">
    <p class="error-text" id="error-text"></p>
  </div>
</div>

<script>
(function () {
  // --- Routing: key and app come from query params ---
  // Bot sends: https://miraiip.github.io/?app=hiddify&key=KEY
  const params  = new URLSearchParams(window.location.search);
  const app     = params.get("app");
  const key     = params.get("key");

  // Sub URL: use key as-is if it's already a full URL, otherwise prepend base
  const subUrl  = key.startsWith("http") ? key : "https://sub.crol-dark.tech/" + key;

  function showError(msg) {
    document.getElementById("loading-state").style.display = "none";
    document.getElementById("error-state").style.display   = "block";
    document.getElementById("error-text").textContent = msg;
  }

  function showButtons() {
    document.getElementById("loading-state").style.display = "none";
    document.getElementById("action-state").style.display  = "flex";
  }

  // Validate params
  if (!app || !key) {
    showError("Неверная ссылка. Вернитесь в бот и попробуйте снова.");
    return;
  }

  // --- Deep link + store mapping ---
  const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent);

  let deepLink  = null;
  let storeLink = null;

  switch (app) {
    case "happ":
      deepLink  = "happ://add/" + subUrl;
      storeLink = isIOS
        ? "https://apps.apple.com/ru/app/happ-proxy-utility-plus/id6746188973"
        : "https://play.google.com/store/apps/details?id=com.happproxy";
      break;

    case "hiddify":
      deepLink  = "hiddify://install-sub/?url=" + encodeURIComponent(subUrl);
      storeLink = isIOS
        ? "https://apps.apple.com/us/app/hiddify-proxy-vpn/id6596777532"
        : "https://play.google.com/store/apps/details?id=app.hiddify.com";
      break;

    case "singbox":
      deepLink  = "sing-box://import-remote-profile?url=" + encodeURIComponent(subUrl);
      storeLink = isIOS
        ? "https://apps.apple.com/us/app/sing-box/id6451272673"
        : "https://play.google.com/store/apps/details?id=io.nekohasekai.sfa";
      break;

    case "streisand":
      deepLink  = "streisand://import/" + encodeURIComponent(subUrl);
      storeLink = isIOS
        ? "https://apps.apple.com/us/app/streisand/id6450534064"
        : null;
      break;

    case "v2raytun":
      deepLink  = "v2raytun://import/" + encodeURIComponent(subUrl) + "#CROL VPN";
      storeLink = "https://play.google.com/store/apps/details?id=com.v2raytun.android";
      break;

    case "v2box":
      deepLink  = "v2box://install-sub?url=" + encodeURIComponent(subUrl) + "&name=CROL VPN";
      storeLink = isIOS
        ? "https://apps.apple.com/us/app/v2box-v2ray-client/id6446814690"
        : null;
      break;

    case "v2rayng":
      deepLink  = "v2rayng://install-config?url=" + encodeURIComponent(subUrl) + "&name=CROL VPN";
      storeLink = "https://play.google.com/store/apps/details?id=com.v2ray.ang";
      break;

    case "cmfa":
      deepLink  = "clash://install-config?url=" + encodeURIComponent(subUrl) + "&name=CROL VPN";
      storeLink = "https://play.google.com/store/apps/details?id=com.github.metacubex.clash.meta";
      break;

    default:
      showError("Неизвестный тип приложения. Вернитесь в бот.");
      return;
  }

  // --- Wire up buttons ---
  document.getElementById("btn-add").addEventListener("click", function () {
    window.location.href = deepLink;
  });

  if (storeLink) {
    const storeBtn = document.getElementById("btn-store");
    storeBtn.href = storeLink;
    storeBtn.style.display = "block";
  }

  // --- Auto-redirect via hidden iframe (doesn't unload the page) ---
  function tryDeepLink(url) {
    const iframe = document.createElement("iframe");
    iframe.style.cssText = "position:absolute;width:0;height:0;border:0;visibility:hidden;";
    iframe.src = url;
    document.body.appendChild(iframe);
    setTimeout(function () {
      try { document.body.removeChild(iframe); } catch (_) {}
    }, 2000);
  }

  // Attempt auto-redirect after a short delay
  setTimeout(function () {
    tryDeepLink(deepLink);
    // If the app didn't open within 1.2s, show the buttons
    setTimeout(showButtons, 1200);
  }, 400);
})();
</script>

</body>
</html>
